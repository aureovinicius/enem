<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ec" />
    <meta
      name="description"
      content="Fisio: trilhas gamificadas de Física para o ENEM com questões reais."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <title>Fisio — Física para o ENEM</title>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <a class="brand" href="#aprender" aria-label="Fisio — início">
          <span class="brand-mark" aria-hidden="true">
            <span class="orbit orbit-a"></span>
            <span class="orbit orbit-b"></span>
            <span class="nucleus"></span>
          </span>
          <span>fisio</span>
        </a>

        <nav class="nav-list">
          <a class="nav-item active" href="#aprender" data-view="aprender">
            <span class="nav-icon">⌂</span><span>Aprender</span>
          </a>
          <a class="nav-item" href="#praticar" data-view="praticar">
            <span class="nav-icon">↻</span><span>Praticar</span>
          </a>
          <a class="nav-item" href="#conquistas" data-view="conquistas">
            <span class="nav-icon">★</span><span>Conquistas</span>
          </a>
          <a class="nav-item" href="#sobre" data-view="sobre">
            <span class="nav-icon">i</span><span>Sobre</span>
          </a>
        </nav>

        <div class="sidebar-card">
          <div class="mini-spark">✦</div>
          <p><strong>Um pouco todo dia.</strong></p>
          <p>Resolva uma lição curta e mantenha a sequência acesa.</p>
        </div>
      </aside>

      <main id="app" class="main-content" tabindex="-1"></main>

      <aside id="right-rail" class="right-rail" aria-label="Seu progresso"></aside>
    </div>

    <div id="lesson-modal" class="modal" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
